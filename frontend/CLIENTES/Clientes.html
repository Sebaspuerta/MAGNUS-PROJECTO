<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>

    <link rel="stylesheet" href="Clientes.css">
    <link rel="stylesheet" href="/css/nav.css">
</head>
<body>

<div class="background"></div>

<div class="container">

    <div class="nav-top">
        <a href="/DASHBOARD/Dashboard.html" class="nav-home" title="Dashboard"><i data-lucide="home"></i></a>
        <button class="nav-back" onclick="window.history.back()"><i data-lucide="arrow-left"></i> Regresar</button>
    </div>

    <header class="page-header">
        <div>
            <h1><i data-lucide="user-round"></i> Gestión de Clientes</h1>
            <p>Perfiles, historial y seguimiento de clientes</p>
        </div>
        <button class="btn-primary" id="openModal"><i data-lucide="user-plus"></i> Nuevo Cliente</button>
    </header>

    <section class="stats-grid">
        <div class="stat-card">
            <h3>Total Clientes</h3>
            <span id="stat-total">—</span>
        </div>
        <div class="stat-card">
            <h3>Activos</h3>
            <span id="stat-activos">—</span>
        </div>
        <div class="stat-card">
            <h3>Inactivos</h3>
            <span id="stat-inactivos">—</span>
        </div>
        <div class="stat-card">
            <h3>Con deuda</h3>
            <span id="stat-deuda">—</span>
        </div>
    </section>

    <section class="search-section">
        <input type="text" id="searchInput" placeholder="Buscar cliente por nombre, teléfono...">
    </section>

    <div id="error-global" class="error-inline"></div>

    <section class="clientes-grid" id="clientesGrid">
        <div style="color:var(--muted);padding:20px 0;">Cargando clientes...</div>
    </section>

    <section class="history-section">
        <h2><i data-lucide="list"></i> Listado General</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th>Documento</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </section>

</div>

<!-- MODAL CREAR / EDITAR -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-titulo">Nuevo Cliente</h2>
            <button id="closeModal">✕</button>
        </div>

        <input type="hidden" id="f-id">

        <div class="form-grid">
            <div>
                <label>Nombre completo *</label>
                <input type="text" id="f-nombre" placeholder="Nombre">
            </div>
            <div>
                <label>Teléfono</label>
                <input type="text" id="f-telefono" placeholder="Celular">
            </div>
            <div>
                <label>Email</label>
                <input type="email" id="f-email" placeholder="correo@ejemplo.com">
            </div>
            <div>
                <label>N° documento</label>
                <input type="text" id="f-documento" placeholder="CC / NIT">
            </div>
            <div>
                <label>Fecha nacimiento</label>
                <input type="date" id="f-nacimiento">
            </div>
        </div>

        <textarea id="f-notas" placeholder="Observaciones y notas internas..."></textarea>

        <div id="error-modal" class="error-inline"></div>

        <button class="btn-primary save-btn" id="btn-guardar">Guardar Cliente</button>
    </div>
</div>

<!-- MODAL PERFIL -->
<div class="modal-perfil" id="modal-perfil">
    <div class="perfil-box">
        <h3 id="perfil-titulo">Perfil del Cliente</h3>
        <div id="perfil-content">Cargando...</div>
        <button class="btn-secondary" style="width:100%;margin-top:18px;" onclick="cerrarPerfil()">Cerrar</button>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/guard.js"></script>
<script src="/js/idle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/CLIENTES/Clientes.js"></script>
<script>lucide.createIcons();</script>

</body>
</html>
