<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barberos - Magnus Barber</title>

    <link rel="stylesheet" href="Barberos.css">
    <link rel="stylesheet" href="/css/nav.css">
</head>
<body>

<div class="background"></div>

<div class="container">

    <div class="nav-top">
        <a href="/DASHBOARD/Dashboard.html" class="nav-home" title="Dashboard"><i data-lucide="home"></i></a>
        <button class="nav-back" onclick="window.history.back()"><i data-lucide="arrow-left"></i> Regresar</button>
    </div>

    <header class="page-header">
        <div>
            <h1><i data-lucide="users"></i> Barberos</h1>
            <p>Administración completa del equipo Magnus</p>
        </div>
        <button class="btn-primary" id="openModal"><i data-lucide="user-plus"></i> Nuevo Barbero</button>
    </header>

    <section class="stats-grid">
        <div class="stat-card">
            <h3>Activos</h3>
            <span id="stat-activos">—</span>
        </div>
        <div class="stat-card">
            <h3>Inactivos</h3>
            <span id="stat-inactivos">—</span>
        </div>
        <div class="stat-card">
            <h3>Total</h3>
            <span id="stat-total">—</span>
        </div>
    </section>

    <section class="barberos-grid" id="barberos-grid">
        <div style="color:#9aa4b2;padding:20px 0;">Cargando barberos...</div>
    </section>

    <section class="history-section">
        <h2><i data-lucide="list"></i> Historial de Barberos</h2>
        <div id="error-global" class="error-inline"></div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Alias</th>
                    <th>Teléfono</th>
                    <th>Comisión</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </section>

</div>

<!-- MODAL CREAR / EDITAR -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-titulo">Nuevo Barbero</h2>
            <button id="closeModal">✕</button>
        </div>

        <input type="hidden" id="f-id">

        <div class="form-grid">
            <div>
                <label>Nombre completo *</label>
                <input type="text" id="f-nombre" placeholder="Nombre completo">
            </div>
            <div>
                <label>Alias / Apodo</label>
                <input type="text" id="f-alias" placeholder="Alias">
            </div>
            <div>
                <label>Teléfono</label>
                <input type="text" id="f-telefono" placeholder="Teléfono">
            </div>
            <div>
                <label>Tipo comisión</label>
                <select id="f-comision-tipo">
                    <option value="porcentaje">Porcentaje (%)</option>
                    <option value="fijo">Monto fijo</option>
                </select>
            </div>
            <div>
                <label>Valor comisión</label>
                <input type="number" id="f-comision-valor" placeholder="0" min="0" step="any">
            </div>
            <div>
                <label>Notas</label>
                <input type="text" id="f-notas" placeholder="Observaciones...">
            </div>
        </div>

        <div id="error-modal" class="error-inline"></div>

        <button class="btn-primary save-btn" id="btn-guardar">Guardar Barbero</button>
    </div>
</div>

<!-- MODAL RENDIMIENTO -->
<div class="modal-rendimiento" id="modal-rendimiento">
    <div class="rend-box">
        <h3 id="rend-titulo">Rendimiento</h3>
        <div id="rend-content">Cargando...</div>
        <button class="btn-secondary" style="width:100%;margin-top:18px;" onclick="cerrarRendimiento()">Cerrar</button>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/guard.js"></script>
<script src="/js/idle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="/BARBEROS/Barberos.js"></script>
<script>lucide.createIcons();</script>

</body>
</html>
