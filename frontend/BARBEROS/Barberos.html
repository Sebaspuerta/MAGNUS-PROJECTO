<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Barberos</title>

    <link rel="stylesheet" href="Barberos.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/nav.css">

    <style>
        select { padding:14px; border:none; border-radius:10px; background:#13233d; color:white; width:100%; }
        .error-inline { color:#ef9a9a; font-size:.82rem; margin-top:8px; min-height:1em; }
        .modal-rendimiento { position:fixed; inset:0; background:rgba(0,0,0,.8); display:none; justify-content:center; align-items:center; z-index:300; }
        .modal-rendimiento.active { display:flex; }
        .rend-box { background:#0d1a2d; border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:28px; width:420px; max-width:95%; }
        .rend-box h3 { font-family:'Cinzel',serif; color:#c89b3c; margin-bottom:16px; }
        .rend-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:.88rem; }
        .rend-row:last-child { border-bottom:none; }
        .rend-row .lbl { color:#9aa4b2; }
        .rend-row .val { font-weight:600; }
    </style>
</head>
<body>

<div class="background"></div>

<div class="container">

    <div class="nav-top">
        <a href="/DASHBOARD/Dashboard.html" class="nav-home" title="Dashboard">🏠</a>
        <button class="nav-back" onclick="window.history.back()">← Regresar</button>
    </div>

    <header class="page-header">
        <div>
            <h1>⚔ Gestión de Barberos</h1>
            <p>Administración completa del equipo Magnus</p>
        </div>
        <button class="btn-primary" id="openModal">+ Nuevo Barbero</button>
    </header>

    <section class="stats-grid">
        <div class="stat-card">
            <h3>Activos</h3>
            <span id="stat-activos">—</span>
        </div>
        <div class="stat-card">
            <h3>Inactivos</h3>
            <span id="stat-inactivos">—</span>
        </div>
        <div class="stat-card">
            <h3>Total</h3>
            <span id="stat-total">—</span>
        </div>
    </section>

    <section class="barberos-grid" id="barberos-grid">
        <div style="color:#9aa4b2;padding:20px 0;">Cargando barberos...</div>
    </section>

    <section class="history-section">
        <h2>Historial de Barberos</h2>
        <div id="error-global" class="error-inline"></div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Alias</th>
                    <th>Teléfono</th>
                    <th>Comisión</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
        </table>
    </section>

</div>

<!-- MODAL CREAR / EDITAR -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-titulo">Nuevo Barbero</h2>
            <button id="closeModal">✕</button>
        </div>

        <input type="hidden" id="f-id">

        <div class="form-grid">
            <div>
                <label style="color:#9aa4b2;font-size:.78rem;">Nombre completo *</label>
                <input type="text" id="f-nombre" placeholder="Nombre completo">
            </div>
            <div>
                <label style="color:#9aa4b2;font-size:.78rem;">Alias / Apodo</label>
                <input type="text" id="f-alias" placeholder="Alias">
            </div>
            <div>
                <label style="color:#9aa4b2;font-size:.78rem;">Teléfono</label>
                <input type="text" id="f-telefono" placeholder="Teléfono">
            </div>
            <div>
                <label style="color:#9aa4b2;font-size:.78rem;">Tipo comisión</label>
                <select id="f-comision-tipo">
                    <option value="porcentaje">Porcentaje (%)</option>
                    <option value="fijo">Monto fijo</option>
                </select>
            </div>
            <div>
                <label style="color:#9aa4b2;font-size:.78rem;">Valor comisión</label>
                <input type="number" id="f-comision-valor" placeholder="0" min="0" step="any">
            </div>
            <div>
                <label style="color:#9aa4b2;font-size:.78rem;">Notas</label>
                <input type="text" id="f-notas" placeholder="Observaciones...">
            </div>
        </div>

        <div id="error-modal" class="error-inline"></div>

        <button class="btn-primary save-btn" id="btn-guardar">Guardar Barbero</button>
    </div>
</div>

<!-- MODAL RENDIMIENTO -->
<div class="modal-rendimiento" id="modal-rendimiento">
    <div class="rend-box">
        <h3 id="rend-titulo">Rendimiento</h3>
        <div id="rend-content">Cargando...</div>
        <button class="btn-secondary" style="width:100%;margin-top:18px;" onclick="cerrarRendimiento()">Cerrar</button>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/guard.js"></script>
<script src="/BARBEROS/Barberos.js"></script>

</body>
</html>
