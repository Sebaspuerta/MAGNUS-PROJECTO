<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Alertas Viking</title>

<link href="Alertas.css" rel="stylesheet">
<link rel="stylesheet" href="/css/nav.css">
</head>

<body>

<div class="container">

    <div class="nav-top">
        <a href="/DASHBOARD/Dashboard.html" class="nav-home" title="Dashboard"><i data-lucide="home"></i></a>
        <button class="nav-back" onclick="window.history.back()"><i data-lucide="arrow-left"></i> Regresar</button>
    </div>

    <div class="header">
        <div>
            <h1><i data-lucide="bell"></i> Dashboard de Alertas</h1>
            <p class="subtitle">Estado general del clan barbería</p>
        </div>
    </div>

    <!-- RESUMEN -->
    <div class="summary">

        <div class="box">
            <h3>Deudas</h3>
            <span id="deudas">0</span>
        </div>

        <div class="box">
            <h3>Stock Bajo</h3>
            <span id="stockBajo">0</span>
        </div>

        <div class="box">
            <h3>Agotados</h3>
            <span id="agotados">0</span>
        </div>

        <div class="box">
            <h3>Comandas</h3>
            <span id="comandas">0</span>
        </div>

    </div>

    <!-- ALERTAS -->
    <div class="grid" id="grid"></div>

</div>

<script src="/js/api.js"></script>
<script src="/js/guard.js"></script>
<script src="/js/idle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="Alertas.js"></script>
<script>lucide.createIcons();</script>

</body>
</html>
