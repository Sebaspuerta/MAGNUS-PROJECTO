<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="Register.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="background"></div>

<div class="register-container">

    <div class="left-panel">

        <div class="logo-container">
            <img src="logo.jpeg" alt="Magnus Barber">
        </div>

        <h1>ÚNETE AL CLAN</h1>

        <p>
            Regístrate y comienza tu experiencia
            en Magnus Barber System.
        </p>

    </div>

    <div class="right-panel">

        <h2>Crear Cuenta</h2>

        <form>

            <input type="text" placeholder="Nombre completo">

            <input type="text" placeholder="Usuario">

            <input type="email" placeholder="Correo">

            <input type="password" placeholder="Contraseña">

            <input type="password" placeholder="Confirmar contraseña">

            <button>
                Registrarse
            </button>

            <a href="login.html">
                Ya tengo cuenta
            </a>

        </form>

    </div>

</div>

<script src="register.js"></script>

</body>
</html>
