<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnus Barber - Login</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background"></div>
    <div class="login-container">

        <div class="logo-section">
            <!-- TU LOGO -->
            <div class="logo-placeholder">
                <img src="logo.jpeg" alt="Magnus Barber Logo" id="logo">
            </div>

            <h1>MAGNUS</h1>
            <h2>BARBER SYSTEM</h2>

            <p>
                No es un corte,
                es una experiencia.
            </p>

        </div>

        <div class="form-section">

            <h3>Iniciar Sesión</h3>

            <form>

                <div class="input-group">
                    <input type="text" placeholder="Usuario">
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Contraseña">
                </div>

                <button type="submit">
                    Entrar
                </button>

                <a href="#">
                    ¿Olvidaste tu contraseña?
                </a>

                <span>
                    ¿No tienes cuenta?
                    <a href="register.html">
                        Registrarse
                    </a>
                </span>

            </form>

        </div>

</div>

<script src="login.js"></script>

</body>
</html>
