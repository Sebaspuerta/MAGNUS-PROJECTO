<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Viking Barber</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="Servicios.css" rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>⚔ Catálogo de Servicios</h1>
            <p>Barbería temática vikinga</p>
        </div>
        <button class="primary" onclick="openModal()">+ Nuevo</button>
    </div>

    <div class="search">
        <input type="text" id="search" placeholder="Buscar servicio..." oninput="render()">
    </div>

    <div class="grid" id="grid"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-box">
        <h2>Servicio</h2>

        <input type="hidden" id="index">

        <div class="group">
            <label>Nombre</label>
            <input id="name">
        </div>

        <div class="group">
            <label>Descripción</label>
            <textarea id="desc"></textarea>
        </div>

        <div class="group">
            <label>Precio</label>
            <input type="number" id="price">
        </div>

        <div class="group">
            <label>Duración</label>
            <input type="number" id="duration">
        </div>

        <div class="group">
            <label>Categoría</label>
            <select id="category">
                <option>Corte</option>
                <option>Barba</option>
                <option>Cejas</option>
                <option>Tintura</option>
            </select>
        </div>

        <div class="group">
            <label>Consumibles</label>
            <input id="consumables" placeholder="Cuchillas, Toallas">
        </div>

        <button class="primary save" onclick="save()">Guardar</button>
        <button class="secondary save" onclick="closeModal()">Cerrar</button>
    </div>
</div>

<script src="Servicios.js"></script>

</body>
</html>
